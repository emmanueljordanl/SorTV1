architecture: mobilenet_v3_small
initial_weights: IMAGENET1K_V1
seed: 42
manifest: training/datasets/prepared.csv
output: evidence/experiments/ml
batch_size: 32
workers: 0
threads: 4
device: auto
head_epochs: 5
head_learning_rate: 0.001
finetune_epochs: 20
finetune_learning_rate: 0.0001
finetune_last_blocks: 3
early_stopping_patience: 5
augmentation:
  rotation_degrees: 10
  translation_fraction: 0.04
  brightness: [0.9, 1.1]
  contrast: [0.95, 1.05]
